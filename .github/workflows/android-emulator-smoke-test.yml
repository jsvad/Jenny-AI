name: Android emulator smoke test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Jenny launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open("tools/jenny_icon.jpg").convert("RGB")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = Path("app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  target / "ic_launcher.png", format="PNG", optimize=True
              )
          PY

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Start Android emulator and launch Jenny
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.jennyai.app android.permission.RECORD_AUDIO || true
            adb shell monkey -p com.jennyai.app 1
            sleep 20
            mkdir -p emulator-results
            adb shell screencap -p /sdcard/jenny-home.png
            adb pull /sdcard/jenny-home.png emulator-results/jenny-home.png
            adb logcat -d -t 12000 > emulator-results/logcat.txt
            adb shell dumpsys activity activities > emulator-results/activity.txt
            adb shell pidof com.jennyai.app

      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenny-android-emulator-results
          path: emulator-results/
          if-no-files-found: warn
