name: Android emulator smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Jenny launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open("tools/jenny_icon.jpg").convert("RGB")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = Path("app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  target / "ic_launcher.png", format="PNG", optimize=True
              )
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Start Android emulator and launch Jenny
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set +e
            mkdir -p emulator-results
            echo "Waiting for an online emulator..."
            for attempt in $(seq 1 90); do
              STATE=$(adb get-state 2>/dev/null)
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then
                echo "Emulator is fully booted."
                break
              fi
              sleep 5
            done

            STATE=$(adb get-state 2>/dev/null)
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$STATE" != "device" ] || [ "$BOOT" != "1" ]; then
              echo "Emulator did not become ready: state=$STATE boot=$BOOT"
              adb devices -l > emulator-results/adb-devices.txt 2>&1
              adb logcat -d -t 12000 > emulator-results/logcat.txt 2>&1
              exit 1
            fi

            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            INSTALL_RESULT=$?
            if [ $INSTALL_RESULT -ne 0 ]; then
              adb logcat -d -t 12000 > emulator-results/logcat.txt 2>&1
              exit $INSTALL_RESULT
            fi

            adb shell pm grant com.jennyai.app android.permission.RECORD_AUDIO || true
            adb shell monkey -p com.jennyai.app 1
            sleep 25

            adb shell pidof com.jennyai.app > emulator-results/app-pid.txt 2>&1
            if [ ! -s emulator-results/app-pid.txt ]; then
              echo "Jenny process is not running after launch."
              adb logcat -d -t 12000 > emulator-results/logcat.txt 2>&1
              adb shell dumpsys activity activities > emulator-results/activity.txt 2>&1
              exit 1
            fi

            adb shell screencap -p /sdcard/jenny-home.png
            adb pull /sdcard/jenny-home.png emulator-results/jenny-home.png
            SCREEN_RESULT=$?
            adb logcat -d -t 12000 > emulator-results/logcat.txt 2>&1
            adb shell dumpsys activity activities > emulator-results/activity.txt 2>&1
            adb devices -l > emulator-results/adb-devices.txt 2>&1

            if [ $SCREEN_RESULT -ne 0 ] || [ ! -s emulator-results/jenny-home.png ]; then
              echo "Screenshot capture failed."
              exit 1
            fi
            echo "Jenny launched and screenshot captured successfully."

      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenny-android-emulator-results
          path: emulator-results/
          if-no-files-found: warn
