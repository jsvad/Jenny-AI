name: Android emulator smoke test

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Jenny launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open("tools/jenny_icon.jpg").convert("RGB")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = Path("app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  target / "ic_launcher.png", format="PNG", optimize=True
              )
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Start Android emulator and launch Jenny
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: bash .github/scripts/emulator-smoke-test.sh
      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenny-android-emulator-results
          path: emulator-results/
          if-no-files-found: warn
