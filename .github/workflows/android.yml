name: Build Jenny AI 0.4.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release/jenny-complete-0.4.0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Jenny launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open("tools/jenny_icon.jpg").convert("RGB")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = Path("app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  target / "ic_launcher.png", format="PNG", optimize=True
              )
          PY

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jenny-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK and report install metadata
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          BADGING="$("$AAPT" dump badging "$APK_PATH")"
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" || true

          APK_SIZE="$(stat -c%s "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          {
            echo "## Jenny AI APK verification"
            echo "- APK signature: verified"
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- SHA-256: ${APK_SHA256}"
            echo "Android package metadata:"
            echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and rename test APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JennyAI-0.4.1.apk
          sha256sum JennyAI-0.4.1.apk > JennyAI-0.4.1.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JennyAI-0.4.1-test
          path: |
            JennyAI-0.4.1.apk
            JennyAI-0.4.1.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK release
        if: github.ref == 'refs/heads/release/jenny-complete-0.4.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1
          name: Jenny AI 0.4.1 (test)
          body: |
            Test build with full-body avatar framing adjustments.
            APK signature and package metadata are verified in the workflow.
          files: |
            JennyAI-0.4.1.apk
            JennyAI-0.4.1.apk.sha256
          overwrite_files: true
          make_latest: false
